<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cor para Todxs">
  <title>Cor para Todxs</title>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>

  <!-- Anel exterior -->
  <circle cx="256" cy="256" r="208" fill="#F9FAFB" stroke="#1F2937" stroke-width="8"/>

  <!-- Os 5 símbolos primários ColorADD dispostos em pentágono -->

  <!-- ▲ Triângulo (Azul) — topo -->
  <polygon points="256,100 218,170 294,170" fill="#2563EB" stroke="#1F2937" stroke-width="3" stroke-linejoin="round"/>

  <!-- ◆ Losango (Amarelo) — direita -->
  <polygon points="412,210 446,256 412,302 378,256" fill="#F59E0B" stroke="#1F2937" stroke-width="3" stroke-linejoin="round"/>

  <!-- ● Círculo (Vermelho) — inferior direita -->
  <circle cx="356" cy="402" r="36" fill="#DC2626" stroke="#1F2937" stroke-width="3"/>

  <!-- ■ Quadrado preenchido (Preto) — inferior esquerda -->
  <rect x="120" y="365" width="72" height="72" fill="#111827" stroke="#1F2937" stroke-width="3"/>

  <!-- □ Quadrado vazio (Branco) — esquerda -->
  <rect x="66" y="220" width="72" height="72" fill="#FFFFFF" stroke="#1F2937" stroke-width="6"/>
</svg>
